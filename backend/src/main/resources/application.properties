spring.application.name=unified-calendar

# ── SQLite datasource ──────────────────────────────────────────────────────────
spring.datasource.url=jdbc:sqlite:${DB_PATH:./data/unified-calendar.db}
spring.datasource.driver-class-name=org.sqlite.JDBC


# ── Flyway ─────────────────────────────────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ── Server ─────────────────────────────────────────────────────────────────────
server.port=8080

# ── Session cookie ─────────────────────────────────────────────────────────────
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
# M3: secure=true ensures the cookie is never sent over plain HTTP.
# Override to false in application-local.properties for local dev (HTTP only).
server.servlet.session.cookie.secure=true

# ── Actuator ───────────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# ── CORS ───────────────────────────────────────────────────────────────────────
app.cors.allowed-origins=http://localhost:5173

# ── App base URL (used in email cancel/reschedule links) ───────────────────────
app.base-url=http://localhost:5173

# ── External secrets (provided via environment variables) ──────────────────────
google.client-id=${GOOGLE_CLIENT_ID:}
google.client-secret=${GOOGLE_CLIENT_SECRET:}
microsoft.client-id=${MICROSOFT_CLIENT_ID:}
microsoft.client-secret=${MICROSOFT_CLIENT_SECRET:}
microsoft.tenant-id=${MICROSOFT_TENANT_ID:common}
# M2: Provide ENCRYPTION_SECRET_KEY via environment (or application-local.properties in dev).
encryption.secret-key=${ENCRYPTION_SECRET_KEY}
resend.api-key=${RESEND_API_KEY:}
email.from=${EMAIL_FROM:Unified Calendar <bookings@notification.zhouhuds.com>}
email.async.core-pool-size=${EMAIL_ASYNC_CORE_POOL_SIZE:2}
email.async.max-pool-size=${EMAIL_ASYNC_MAX_POOL_SIZE:4}
email.async.queue-capacity=${EMAIL_ASYNC_QUEUE_CAPACITY:100}
